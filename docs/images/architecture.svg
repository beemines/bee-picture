<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 8 3 0 6" fill="none" stroke="#93a69b"/></marker></defs><rect width="1280" height="620" rx="20" fill="#f6f8f4"/><g font-family="Arial,Microsoft YaHei,sans-serif"><text x="56" y="70" font-size="31" fill="#234b3c" font-weight="bold">Bee Picture 系统架构</text><text x="56" y="105" font-size="15" fill="#728076">前后端分离 · Cookie 会话 · 空间权限 · 可选外部能力</text><g fill="white" stroke="#d9e3da" stroke-width="2"><rect x="60" y="170" width="260" height="190" rx="16"/><rect x="420" y="170" width="360" height="340" rx="16"/><rect x="890" y="160" width="320" height="92" rx="12"/><rect x="890" y="280" width="320" height="92" rx="12"/><rect x="890" y="400" width="320" height="92" rx="12"/></g><g stroke="#93a69b" stroke-width="2" marker-end="url(#arrow)"><path d="M320 245H418"/><path d="M780 205H888"/><path d="M780 325H888"/><path d="M780 445H888"/></g><g font-size="23" fill="#234b3c" font-weight="bold"><text x="90" y="215">Vue 3 + TypeScript</text><text x="450" y="215">Spring Boot 2.7</text><text x="920" y="197">MySQL + Redis</text><text x="920" y="317">腾讯云 COS</text><text x="920" y="437">DashScope / 外部搜索</text></g><g font-size="17" fill="#68796d"><text x="90" y="255">Ant Design Vue · ECharts</text><text x="90" y="291">上传 / 检索 / 团队 / 分析</text><text x="90" y="325">REST API + WebSocket</text><text x="450" y="265">Controller → Service → Mapper</text><text x="450" y="310">会话与空间成员权限校验</text><text x="450" y="355">元数据 / 审核 / 空间配额</text><text x="450" y="400">图片处理与异步任务对接</text><text x="450" y="455">Sa-Token · MyBatis-Plus</text><text x="920" y="228">结构化数据 / 会话 / 缓存</text><text x="920" y="348">原图 / 缩略图 / 图片处理</text><text x="920" y="468">AI 扩图 / 以图搜图（可选）</text><text x="60" y="565">文档演示：独立只读 fixture server，不连接数据库、存储桶或付费 AI 服务</text></g></g></svg>
